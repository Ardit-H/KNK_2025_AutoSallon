txtElementi1info=Kur klikohet butoni "Qasuni", ju transferoheni nga faqja kryesore në faqen e regjistrimit dhe log-in. Ku përmes butonit të regjistrimit mund të krijoni një llogari, kurse me login kyqen personat që posedojn llogari adekuate.
