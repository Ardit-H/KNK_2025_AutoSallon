#Help-Admin
lblAdminManual=Manuali i administratorit
ElementeteSiperme=Elementet në pjesën e sipërme:
ElementeteMenus=Elements e menus:
languagebutton=BUTONI I GJUHËS - Ky buton ju lejon të ndryshoni gjuhëne sistemit nga shqip në anglisht dhe anasjelltas.
logoutbutton=DIL - Ky buton përdoret për të dalë nga llogaria juaj në mënyrë të sigurt. Pasi ta klikoni, do të dilni nga faqja aktuale dhe do të ktheheni në faqen kryesore. Përdoreni këtë buton kur të dëshironi të përfundoni përdorimin e aplikacionit ose të ndërroni llogaritë.
lblClients=KLIENTËT - Këtu ju mund ti shikoni, menaxhoni,përditësoni dhe ti fshihni klientët e biznesit.
lblServices=SHËRBIMET - Këtu ju mund ti shikoni,shtoni,përditësoni dhe fshihni shërbimet që biznesi ynë i ofron për klientët përmes partnerëve.
lblRatings=VLERËSIMET - Këtu mund të shikoni vlerësimet që klientët tanë të sistemit kanë bërë për makinat tona. Mund të modifikoni vlerësimin ose komentin, të kërkoni një vlerësim ose të shihni mesataren e vlerësimeve për një makinë specifike.
lblProfile=PROFILI - Këtu mund të menaxhoni të dhënat tuaja personale, të përditësoni email-in, numrin e telefonit, adresën ose të ndryshoni fjalëkalimin.

#Help-User
lblUserManual=Manuali i përdoruesit
lblServicesU=SHËRBIMET - Këtu mund ti shihni shërbimet që i ofrojmë përmes partnerëve tanë.
lblRatingsU=VLERËSIMET - Këtu mund të shihni vlerësimet e përdoruesve të tjerë për makinat tona. Gjithashtu mund të shihni vlerësimet mesatare për çdo makinë që dëshironi.
lblMyRatings=VLERËSIMET E MIA - Vetëm për përdoruesit e kyçur. Këtu mund të shihni vlerësimet dhe komentet që keni bërë për makinat në autosallon. Gjithashtu mund të përditësoni komentin ose vlerësimin.
lblUserProfile=PROFILI - Këtu mund të menaxhoni të dhënat tuaja personale, të përditësoni email-in, numrin e telefonit, adresën ose të ndryshoni fjalëkalimin.



