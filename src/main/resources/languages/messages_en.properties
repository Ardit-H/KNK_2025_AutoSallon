languagebutton=LANGUAGE BUTTON - This button allows you to change the system language from Albanian to English and vice versa.
logoutbutton=LOG OUT - This button is used to log out of your account securely. After clicking, you will log out of the current session and return to the Home page. Use this button when you want to finish using the application or switch accounts.
